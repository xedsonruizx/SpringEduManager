<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link th:href="@{/css/estilos.css}" rel="stylesheet">
  <title th:text="${estudiante.id == null} ? 'Nuevo estudiante' : 'Editar estudiante'">Estudiante</title>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container my-5">
  <div class="row justify-content-center">
    <div class="col-lg-9">
      <div class="card shadow-sm">
        <div class="card-header bg-dark text-white">
          <h4 class="mb-0">
            <i class="bi" th:classappend="${estudiante.id == null} ? 'bi-person-plus' : 'bi-pencil-square'"></i>
            <span th:text="${estudiante.id == null} ? ' Nuevo estudiante' : ' Editar estudiante'"> Estudiante</span>
          </h4>
        </div>
        <div class="card-body p-4">

          <form th:action="@{/estudiantes/guardar}" th:object="${estudiante}" method="post">
            <input type="hidden" th:field="*{id}">

            <div class="row">
              <div class="col-md-4 mb-3">
                <label class="form-label">RUT</label>
                <input type="text" class="form-control" th:field="*{rut}"
                       th:classappend="${#fields.hasErrors('rut')} ? 'is-invalid'" placeholder="12345678-5">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('rut')}" th:errors="*{rut}"></div>
              </div>

              <div class="col-md-4 mb-3">
                <label class="form-label">Nombre</label>
                <input type="text" class="form-control" th:field="*{nombre}"
                       th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
              </div>

              <div class="col-md-4 mb-3">
                <label class="form-label">Fecha de nacimiento</label>
                <input type="date" class="form-control" th:field="*{fechaNacimiento}"
                       th:classappend="${#fields.hasErrors('fechaNacimiento')} ? 'is-invalid'">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('fechaNacimiento')}" th:errors="*{fechaNacimiento}"></div>
              </div>
            </div>

            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">Apellido paterno</label>
                <input type="text" class="form-control" th:field="*{apellidoPaterno}"
                       th:classappend="${#fields.hasErrors('apellidoPaterno')} ? 'is-invalid'">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('apellidoPaterno')}" th:errors="*{apellidoPaterno}"></div>
              </div>

              <div class="col-md-6 mb-3">
                <label class="form-label">Apellido materno</label>
                <input type="text" class="form-control" th:field="*{apellidoMaterno}"
                       th:classappend="${#fields.hasErrors('apellidoMaterno')} ? 'is-invalid'">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('apellidoMaterno')}" th:errors="*{apellidoMaterno}"></div>
              </div>
            </div>

            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">Email</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                  <input type="email" class="form-control" th:field="*{email}"
                         th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
                </div>
                <div class="text-danger small" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
              </div>

              <div class="col-md-6 mb-3">
                <label class="form-label">Telefono</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-telephone"></i></span>
                  <input type="text" class="form-control" th:field="*{telefono}"
                         th:classappend="${#fields.hasErrors('telefono')} ? 'is-invalid'" placeholder="912345678">
                </div>
                <div class="text-danger small" th:if="${#fields.hasErrors('telefono')}" th:errors="*{telefono}"></div>
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label">Direccion</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-geo-alt"></i></span>
                <input type="text" class="form-control" th:field="*{direccion}"
                       th:classappend="${#fields.hasErrors('direccion')} ? 'is-invalid'">
              </div>
              <div class="text-danger small" th:if="${#fields.hasErrors('direccion')}" th:errors="*{direccion}"></div>
            </div>

            <div class="row">
              <div class="col-md-4 mb-3">
                <label class="form-label">Ciudad</label>
                <input type="text" class="form-control" th:field="*{ciudad}"
                       th:classappend="${#fields.hasErrors('ciudad')} ? 'is-invalid'">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('ciudad')}" th:errors="*{ciudad}"></div>
              </div>

              <div class="col-md-4 mb-3">
                <label class="form-label">Asistencia (%)</label>
                <input type="number" step="0.1" min="0" max="100" class="form-control" th:field="*{asistencia}"
                       th:classappend="${#fields.hasErrors('asistencia')} ? 'is-invalid'">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('asistencia')}" th:errors="*{asistencia}"></div>
              </div>

              <div class="col-md-4 mb-3">
                <label class="form-label">Promedio (1.0 - 7.0)</label>
                <input type="number" step="0.1" min="1" max="7" class="form-control" th:field="*{promedio}"
                       th:classappend="${#fields.hasErrors('promedio')} ? 'is-invalid'">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('promedio')}" th:errors="*{promedio}"></div>
              </div>
            </div>

            <div class="form-check form-switch mb-4">
              <input class="form-check-input" type="checkbox" role="switch" id="activo" th:field="*{activo}">
              <label class="form-check-label" for="activo">Estudiante activo</label>
            </div>

            <div class="d-flex flex-wrap gap-2">
              <button type="submit" class="btn btn-primary">
                <i class="bi bi-save me-1"></i>Guardar
              </button>
              <a th:href="@{/estudiantes}" class="btn btn-secondary">
                <i class="bi bi-x-circle me-1"></i>Cancelar
              </a>
            </div>
          </form>

        </div>
      </div>
    </div>
  </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
