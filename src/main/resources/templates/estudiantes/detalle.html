<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link th:href="@{/css/estilos.css}" rel="stylesheet">
  <title>Detalle del estudiante</title>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container my-5">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0"><i class="bi bi-person-vcard me-2"></i>Detalle del estudiante</h1>
        <a th:href="@{/estudiantes}" class="btn btn-secondary">
          <i class="bi bi-arrow-left me-1"></i>Volver
        </a>
      </div>

      <div class="card shadow-sm">
        <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center flex-wrap gap-2">
          <h5 class="mb-0" th:text="${estudiante.nombre} + ' ' + ${estudiante.apellidoPaterno} + ' ' + ${estudiante.apellidoMaterno}">
            Nombre Completo
          </h5>
          <span th:if="${estudiante.activo}" class="badge bg-success">Activo</span>
          <span th:unless="${estudiante.activo}" class="badge bg-secondary">Inactivo</span>
        </div>
        <div class="card-body">
          <dl class="row mb-0">
            <dt class="col-sm-4"><i class="bi bi-card-text me-1"></i>RUT</dt>
            <dd class="col-sm-8" th:text="${estudiante.rut}">12345678-9</dd>

            <dt class="col-sm-4"><i class="bi bi-envelope me-1"></i>Email</dt>
            <dd class="col-sm-8" th:text="${estudiante.email}">ana@mail.com</dd>

            <dt class="col-sm-4"><i class="bi bi-telephone me-1"></i>Telefono</dt>
            <dd class="col-sm-8" th:text="${estudiante.telefono}">912345678</dd>

            <dt class="col-sm-4"><i class="bi bi-calendar-event me-1"></i>Fecha de nacimiento</dt>
            <dd class="col-sm-8" th:text="${estudiante.fechaNacimiento}">2000-05-14</dd>

            <dt class="col-sm-4"><i class="bi bi-geo-alt me-1"></i>Direccion</dt>
            <dd class="col-sm-8" th:text="${estudiante.direccion}">Av. Siempre Viva 123</dd>

            <dt class="col-sm-4"><i class="bi bi-pin-map me-1"></i>Ciudad</dt>
            <dd class="col-sm-8" th:text="${estudiante.ciudad}">Santiago</dd>

            <dt class="col-sm-4"><i class="bi bi-bar-chart-line me-1"></i>Asistencia</dt>
            <dd class="col-sm-8" th:text="${estudiante.asistencia} + '%'">95.0%</dd>

            <dt class="col-sm-4"><i class="bi bi-star me-1"></i>Promedio</dt>
            <dd class="col-sm-8" th:text="${estudiante.promedio}">6.2</dd>
          </dl>
        </div>
        <div class="card-footer d-flex flex-wrap gap-2" sec:authorize="hasRole('ADMIN')">
          <a th:href="@{/estudiantes/editar/{id}(id=${estudiante.id})}" class="btn btn-outline-warning">
            <i class="bi bi-pencil-square me-1"></i>Editar
          </a>
          <button type="button" class="btn btn-outline-danger"
                  th:attr="onclick=|confirmarEliminacion('formEliminarDetalle${estudiante.id}')|">
            <i class="bi bi-trash me-1"></i>Eliminar
          </button>
          <form th:id="'formEliminarDetalle' + ${estudiante.id}"
                th:action="@{/estudiantes/eliminar/{id}(id=${estudiante.id})}"
                method="post" class="d-none"></form>
        </div>
      </div>
    </div>
  </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
  function confirmarEliminacion(formId) {
    Swal.fire({
      title: 'Eliminar estudiante?',
      text: 'Esta accion no se puede deshacer.',
      icon: 'warning',
      showCancelButton: true,
      confirmButtonText: 'Si, eliminar',
      cancelButtonText: 'Cancelar',
      reverseButtons: true,
      confirmButtonColor: '#dc3545'
    }).then((resultado) => {
      if (resultado.isConfirmed) {
        document.getElementById(formId).submit();
      }
    });
  }
</script>
</body>
</html>
