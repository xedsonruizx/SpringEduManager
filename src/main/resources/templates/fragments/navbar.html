<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark" th:fragment="navbar">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" th:href="@{/}">
        <i class="bi bi-mortarboard-fill me-2"></i>SpringEduManager
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
              data-bs-target="#navMenu" aria-controls="navMenu"
              aria-expanded="false" aria-label="Menu">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link" th:href="@{/}"><i class="bi bi-house-door me-1"></i>Inicio</a>
          </li>
          <li class="nav-item" sec:authorize="isAuthenticated()">
            <a class="nav-link" th:href="@{/estudiantes}"><i class="bi bi-people me-1"></i>Estudiantes</a>
          </li>
        </ul>

        <div sec:authorize="isAnonymous()">
          <a th:href="@{/login}" class="btn btn-outline-light">
            <i class="bi bi-box-arrow-in-right me-1"></i>Ingresar
          </a>
        </div>

        <div sec:authorize="isAuthenticated()"
             class="d-flex flex-column flex-lg-row align-items-start align-items-lg-center gap-2 navbar-user-block">
          <div class="d-flex align-items-center flex-wrap gap-2">
            <span sec:authorize="hasRole('ADMIN')" class="badge bg-danger">ADMIN</span>
            <span sec:authorize="hasRole('USER')" class="badge bg-primary">USER</span>
            <span class="text-white-50">
              <i class="bi bi-person-circle me-1"></i><span sec:authentication="name">usuario</span>
            </span>
          </div>
          <form th:action="@{/logout}" method="post">
            <button type="submit" class="btn btn-outline-light btn-sm">
              <i class="bi bi-box-arrow-right me-1"></i>Cerrar sesion
            </button>
          </form>
        </div>
      </div>
    </div>
  </nav>
</body>
</html>
