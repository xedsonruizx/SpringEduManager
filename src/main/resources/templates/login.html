<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link th:href="@{/css/estilos.css}" rel="stylesheet">
  <title>Iniciar sesion - SpringEduManager</title>
</head>
<body class="bg-light">
  <div class="container">
    <div class="row justify-content-center mt-5">
      <div class="col-md-5 col-lg-4">
        <div class="text-center mb-3">
          <i class="bi bi-mortarboard-fill display-4 text-primary"></i>
        </div>
        <div class="card shadow">
          <div class="card-header bg-dark text-white text-center">
            <h4 class="mb-0"><i class="bi bi-box-arrow-in-right me-2"></i>Iniciar sesion</h4>
          </div>
          <div class="card-body">
            <div th:if="${param.error}" class="alert alert-danger" role="alert">
              <i class="bi bi-exclamation-triangle me-1"></i>Usuario o contrasena incorrectos.
            </div>
            <div th:if="${param.logout}" class="alert alert-success" role="alert">
              <i class="bi bi-check-circle me-1"></i>Has cerrado sesion correctamente.
            </div>
            <div th:if="${param.registro}" class="alert alert-success" role="alert">
              <i class="bi bi-check-circle me-1"></i>Registro realizado correctamente. Ya puedes iniciar sesion.
            </div>

            <form th:action="@{/login}" method="post">
              <div class="mb-3">
                <label for="username" class="form-label">Email</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                  <input type="text" class="form-control" id="username" name="username"
                         placeholder="Ingrese su email" required autofocus>
                </div>
              </div>
              <div class="mb-3">
                <label for="password" class="form-label">Contrasena</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-lock"></i></span>
                  <input type="password" class="form-control" id="password" name="password"
                         placeholder="Ingrese su contrasena" required>
                </div>
              </div>
              <div class="d-grid">
                <button type="submit" class="btn btn-primary">
                  <i class="bi bi-box-arrow-in-right me-1"></i>Ingresar
                </button>
              </div>
            </form>

            <div class="text-center mt-4">
              <p class="mb-2 text-muted">No tienes una cuenta?</p>
              <a th:href="@{/registro}" class="btn btn-outline-secondary">
                <i class="bi bi-person-plus me-1"></i>Registrarse
              </a>
            </div>
            <div class="text-center mt-3">
              <a th:href="@{/}"><i class="bi bi-arrow-left me-1"></i>Volver al inicio</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
