<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link th:href="@{/css/estilos.css}" rel="stylesheet">
  <title>Registro - SpringEduManager</title>
</head>
<body class="bg-light">
  <div th:replace="~{fragments/navbar :: navbar}"></div>

  <div class="container">
    <div class="row justify-content-center mt-5">
      <div class="col-md-6 col-lg-5">
        <div class="card shadow">
          <div class="card-header bg-dark text-white text-center">
            <h4 class="mb-0"><i class="bi bi-person-plus me-2"></i>Crear cuenta</h4>
          </div>
          <div class="card-body">
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <form th:action="@{/registro}" th:object="${usuarioDTO}" method="post">
              <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                  <input type="email" id="email" class="form-control" th:field="*{email}"
                         placeholder="usuario@email.com">
                </div>
                <div class="text-danger small" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
              </div>

              <div class="mb-3">
                <label for="password" class="form-label">Contrasena</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-lock"></i></span>
                  <input type="password" id="password" class="form-control" th:field="*{password}"
                         placeholder="Minimo 6 caracteres">
                </div>
                <div class="text-danger small" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
              </div>

              <div class="mb-3">
                <label for="confirmPassword" class="form-label">Confirmar contrasena</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                  <input type="password" id="confirmPassword" class="form-control" th:field="*{confirmPassword}">
                </div>
                <div class="text-danger small" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
              </div>

              <div class="d-grid">
                <button type="submit" class="btn btn-primary">
                  <i class="bi bi-person-check me-1"></i>Crear cuenta
                </button>
              </div>
            </form>

            <div class="text-center mt-4">
              <a th:href="@{/login}">Ya tienes una cuenta? Ingresar</a>
            </div>
            <div class="text-center mt-3">
              <a th:href="@{/}"><i class="bi bi-arrow-left me-1"></i>Volver al inicio</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
